  formula: 18240 = 240 + 580 + 17420
  estado: validado

uso_en_gold:
  - pregunta: 1
    indicador: ventas_netas_por_sucursal_mes
    descripcion: >
      Sumar monto_total de tienda_fisica y ecommerce
      por sucursal y mes de fecha_venta.

      Posteriormente restar devoluciones
      segun mes de fecha_devolucion.

  - pregunta: 2
    indicador: top_productos_vendidos
    descripcion: >
      Sumar cantidad por producto_id
      y relacionar con Devoluciones.

  - pregunta: 4
    indicador: ventas_por_vendedor
    descripcion: >
      Considerar solamente tienda_fisica.

      Relacionar vendedor_id con el historial SCD2
      de Empleados para obtener la sucursal vigente
      en la fecha de la venta.

notas_implementacion:
  - Los conteos exploratorios de Bronze pueden solaparse.
  - La deduplicacion se realiza antes de aplicar las reglas de rechazo.
  - Las 240 filas duplicadas son reingestas de contenido identico.
  - No se generan ventas ni vendedores ficticios.
  - Los vendedores nulos de ecommerce se conservan.
  - Los montos invalidos no se reconstruyen desde Catalogo.
  - Los registros de cuarentena conservan su contenido original.
  - Los indicadores de Gold utilizan solamente registros validos de Silver.
  - El README general se actualizara al completar todas las fuentes Silver.
  - La integracion definitiva con Lakeflow sigue pendiente.
