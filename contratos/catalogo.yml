notas_implementacion:
  - Los conteos de Bronze corresponden a las validaciones del 2026-11-20.
  - La dimensión Silver representa el último snapshot completo disponible.
  - El snapshot vigente corresponde al 2026-08-01.
  - Los snapshots anteriores permanecen almacenados en Bronze.
  - Los precios de snapshots anteriores no reemplazan precios inválidos del snapshot vigente.
  - Los precios inválidos del snapshot vigente se envían a cuarentena.
  - Los problemas de snapshots históricos se conservan documentados en Bronze.
  - Los registros rechazados conservan sus datos originales en formato JSON y sus motivos de rechazo.
  - Las correcciones de formato no generan rechazos cuando el valor puede normalizarse.
  - La cuarentena utiliza una tabla compartida para todas las fuentes.
  - Silver catálogo fue creado y validado correctamente el 2026-11-20.
  - La tabla Silver contiene 2349 productos únicos del snapshot de agosto de 2026.
  - Se conservaron 2289 productos activos y 60 productos inactivos.
  - Se normalizaron las categorías a cinco valores oficiales.
  - No existen precios nulos ni no positivos en Silver.
  - Se almacenaron 51 registros rechazados en proyecto_final.silver.cuarentena.
  - Los rechazos corresponden a 24 precios nulos y 27 precios no positivos.
  - Los datos originales de los registros rechazados se conservan en formato JSON.
  - La conciliación final fue satisfactoria con 2400 registros del snapshot vigente, 2349 en Silver y 51 en cuarentena.
  - Los análisis Gold sobre el catálogo comercial vigente deberán filtrar activo = true cuando corresponda.
  - Para analizar ventas históricas se deberá considerar el contexto temporal del producto.
  - Bronze permanece sin modificaciones.