cuarentena:
  tabla: proyecto_final.silver.cuarentena
  fuente: devoluciones
  total_registros: 265

  motivos:
    VENTA_HUERFANA: 198
    REEMBOLSO_INVALIDO: 36
    REEMBOLSO_EXCESIVO: 29
    "VENTA_HUERFANA, REEMBOLSO_INVALIDO": 2

  formato:
    fuente: string
    clave_registro: string
    motivo_rechazo: string
    fecha_rechazo: timestamp
    datos_originales: string
    archivo_origen: string

  politica: >
    Conservar una fila por devolucion rechazada
    despues de la deduplicacion.

    Guardar todos los motivos de rechazo
    y los datos originales de Bronze en JSON.

    Conservar el archivo de origen.

    No modificar los registros de cuarentena
    correspondientes a otras fuentes.

conciliacion:
  total_bronze: 4217
  duplicados_eliminados: 60
  total_cuarentena: 265
  total_silver: 3892
  formula: 4217 = 60 + 265 + 3892
  estado: validado

uso_en_gold:
  - pregunta: 1
    indicador: ventas_netas_por_sucursal_mes
    descripcion: >
      Restar los montos de reembolso validos
      a las ventas brutas.

      Agrupar los reembolsos por sucursal_id
      y mes de fecha_devolucion.

      El periodo de la devolucion puede ser diferente
      del periodo de la venta original.

  - pregunta: 2
    indicador: tasa_devolucion_por_producto
    descripcion: >
      Relacionar las devoluciones validas
      con las ventas por producto_id.

      Calcular la tasa de devolucion siguiendo
      la definicion establecida para Gold,
      evitando duplicidades.

notas_implementacion:
  - >
    Los conteos exploratorios pueden solaparse.
    Las reglas se aplican despues de deduplicar.

  - >
    Los 60 registros duplicados tienen contenido
    de negocio identico.

  - >
    Los 265 rechazos se almacenan en cuarentena,
    no se eliminan sin trazabilidad.

  - >
    Se permiten motivos vacios o nulos.

  - >
    Los reembolsos negativos no se interpretan
    automaticamente como reversas contables.

  - >
    No se modifican ni reconstruyen montos.

  - >
    Silver Ventas debe estar disponible y validada
    antes de procesar Silver Devoluciones.

  - >
    La tabla compartida de cuarentena conserva
    los registros de las demas fuentes.

  - >
    El README general se actualizara cuando
    terminemos todas las fuentes Silver.

  - >
    La integracion definitiva con Lakeflow
    sigue pendiente.
