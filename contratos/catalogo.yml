transformaciones_silver:
  - Eliminar espacios al inicio y final de los campos de texto.
  - Convertir precio_lista de número o texto con moneda a decimal(12,2).
  - Normalizar las 17 variantes de categoria a los cinco valores oficiales.
  - Obtener fecha_snapshot a partir del nombre del archivo de origen.
  - Identificar el snapshot más reciente disponible.
  - Construir la dimensión vigente utilizando el snapshot de agosto de 2026.
  - No recuperar precios de marzo cuando el precio de agosto sea inválido.
  - Conservar productos activos e inactivos cuando cumplan las reglas de calidad.
  - Permitir valores nulos en marca.
  - Validar campos obligatorios y valores permitidos.
  - Deduplicar por producto_id dentro del snapshot vigente utilizando un criterio determinista.
  - Enviar registros inválidos y duplicados excedentes del snapshot vigente a la cuarentena compartida.
  - Conservar los datos originales en formato JSON y registrar el motivo del rechazo.
  - Mantener Bronze sin modificaciones.

problemas_conocidos:
  - problema: precio_lista nulo
    ejemplo: precio_lista=null
    filas_afectadas: 36
    tratamiento: Enviar a cuarentena los registros afectados del snapshot vigente.

  - problema: precio_lista no positivo
    ejemplo: precio_lista<=0
    filas_afectadas: 58
    tratamiento: Enviar a cuarentena los registros afectados del snapshot vigente.

  - problema: marca nula
    ejemplo: marca=null
    filas_afectadas: 94
    tratamiento: Permitir valores nulos porque marca no es un campo obligatorio.

  - problema: producto repetido en snapshot de marzo
    ejemplo: 25 registros duplicados excedentes
    filas_afectadas: 25
    tratamiento: Documentar los duplicados del snapshot histórico conservado en Bronze.

  - problema: categorías variantes
    ejemplo: Climatización / CLIMATIZACION
    filas_afectadas: 4705
    tratamiento: Normalizar las 17 variantes a cinco categorías oficiales.

