
fuente: tracking_envios
version: 2
ultima_actualizacion: '2026-11-21'
responsable: courier_externo_y_logistica

llegada: Azure SQL Database, tabla dbo.TrackingEnvios
metodo_ingesta: >
  Conector query-based de SQL Server (Lakeflow Connect),
  utilizando fecha_modificacion como cursor incremental.

connection_unity_catalog: 'PENDIENTE: nombre real de Connection'
cursor: fecha_modificacion

modo_historia: >
  Preservar los cambios de estado como eventos historicos.
  evento_id identifica cada evento del origen.
  tracking_id identifica el envio, pero no es una llave
  unica de evento.

frecuencia_esperada: >
  Incremental por cursor fecha_modificacion.
  Se exigen dos ejecuciones de ingesta.

tabla_bronze: proyecto_final.bronze.tracking_envios
tabla_silver: proyecto_final.silver.tracking_envios
tabla_cuarentena: proyecto_final.silver.cuarentena

llave: evento_id

depende_de:
  - fuente: ventas
    columna: venta_id
    tabla: proyecto_final.silver.ventas

columnas:
  - nombre: evento_id
    tipo: int
    nulo: false
    regla: >
      Identificador unico de evento.
      No debe ser nulo.

  - nombre: tracking_id
    tipo: string
    nulo: false
    regla: >
      Identificador obligatorio del envio.
      Puede repetirse entre eventos de estados distintos.

  - nombre: venta_id
    tipo: string
    nulo: true
    regla: >
      Aunque puede llegar nulo desde el origen,
      para ingresar a Silver debe existir
      en proyecto_final.silver.ventas.

  - nombre: courier
    tipo: string
    nulo: true
    valores_normalizados:
      - Servientrega
      - Shalom
      - Olva
    regla: >
      Normalizar las variantes reconocidas.
      Conservar NULL si no existe correspondencia,
      segun el contrato de origen.

  - nombre: estado_entrega
    tipo: string
    nulo: true
    valores_permitidos:
      - pendiente
      - en_transito
      - entregado
      - devuelto
    regla: >
      Todo evento aceptado debe tener un estado
      reconocido despues de la normalizacion.

  - nombre: sucursal_origen
    tipo: string
    nulo: true

  - nombre: fecha_actualizacion
    tipo: date
    nulo: true
    regla: >
      Se permiten fechas nulas.
      No se generan fechas artificiales.

  - nombre: fecha_modificacion
    tipo: timestamp
    nulo: false
    regla: >
      Marca temporal obligatoria para ordenar eventos
      y realizar ingesta incremental.

reglas_de_calidad:
  - nombre: evento_identificado
    condicion: evento_id IS NOT NULL
    politica: cuarentena
    motivo_rechazo: EVENTO_ID_INVALIDO
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: >
      Sin evento_id no se puede identificar
      ni auditar correctamente el evento del origen.

  - nombre: tracking_identificado
    condicion: >
      tracking_id IS NOT NULL
      AND TRIM(tracking_id) <> ''
    politica: cuarentena
    motivo_rechazo: TRACKING_ID_INVALIDO
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: >
      Sin tracking_id no se puede reconstruir
      el historial de estados del envio.

  - nombre: fecha_modificacion_valida
    condicion: fecha_modificacion IS NOT NULL
    politica: cuarentena
    motivo_rechazo: FECHA_MODIFICACION_INVALIDA
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: >
      El timestamp permite ordenar cronologicamente
      los eventos y calcular tiempos de entrega.

  - nombre: estado_conocido
    condicion: >
      estado_normalizado IN
      ('pendiente', 'en_transito', 'entregado', 'devuelto')
    politica: cuarentena
    motivo_rechazo: ESTADO_INVALIDO
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: >
      Los estados desconocidos pueden distorsionar
      las tasas de devolucion y los tiempos de entrega.

  - nombre: venta_referenciada
    condicion: >
      venta_id debe existir en proyecto_final.silver.ventas
    politica: cuarentena
    motivo_rechazo: VENTA_HUERFANA
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: >
      Solo se aceptan eventos asociados
      a ventas previamente validadas.

      Los eventos de ventas inexistentes
      o excluidas de Silver Ventas se conservan
      en cuarentena con sus datos originales.

  - nombre: evento_negocio_unico
    condicion: >
      Una sola fila por
      (tracking_id, estado_normalizado, fecha_modificacion)
    politica: deduplicar
    criterio_desempate: menor evento_id
    justificacion: >
      Los mensajes reprocesados no deben producir
      eventos de negocio duplicados.

      La deduplicacion no se realiza solamente
      por tracking_id porque se perderia el historial.

normalizacion_estados:
  valores_salida:
    - pendiente
    - en_transito
    - entregado
    - devuelto

  equivalencias:
    pendiente:
      - PENDIENTE
      - Pendiente
      - pendiente

    en_transito:
      - EN_CAMINO
      - En transito
      - en_transito
      - En camino

    entregado:
      - ENTREGADO
      - Entregado
      - entregado

    devuelto:
      - DEVUELTO
      - Devuelto
      - devuelto

  variantes_originales: 13

  distribucion_normalizada_bronze:
    pendiente: 5362
    en_transito: 5313
    entregado: 4180
    devuelto: 284

  estados_invalidos_detectados: 0

normalizacion_couriers:
  valores_salida:
    - Servientrega
    - Shalom
    - Olva

  equivalencias:
    Servientrega:
      - SERVIENTREGA
      - Servientrega
      - servientrega

    Shalom:
      - SHALOM
      - Shalom
      - shalom

    Olva:
      - Olva
      - OLVA COURIER
      - Olva Courier
      - olva courier

  variantes_originales: 10
  couriers_normalizados: 3

  validacion_por_envio:
    total_envios_bronze: 5332
    envios_un_courier_normalizado: 5332
    envios_varios_couriers_normalizados: 0
    envios_sin_courier_reconocido: 0

transformaciones_silver:
  - >
    Leer proyecto_final.bronze.tracking_envios
    conservando los ocho campos del origen.

  - >
    Normalizar estado_entrega utilizando
    LOWER y TRIM con las equivalencias definidas.

  - >
    Normalizar courier a Servientrega, Shalom
    u Olva utilizando LOWER y TRIM.

  - >
    Detectar mensajes reprocesados mediante
    (tracking_id, estado_normalizado,
    fecha_modificacion).

  - >
    Si existen mensajes reprocesados,
    conservar el evento con menor evento_id.

  - >
    Conservar todos los eventos de estado
    validos correspondientes a cada tracking_id.

  - >
    Validar venta_id mediante LEFT JOIN
    contra proyecto_final.silver.ventas.

  - >
    Generar motivo_rechazo con todas
    las condiciones incumplidas.

  - >
    Mantener fecha_actualizacion nula
    cuando asi llegue desde el origen.

  - >
    Seleccionar las ocho columnas
    definidas en el contrato para Silver.

  - >
    Enviar eventos invalidos a cuarentena,
    conservando los datos originales en JSON.

  - >
    Registrar la procedencia de los rechazos como
    Azure SQL Database - dbo.TrackingEnvios.

  - >
    Guardar la tabla Silver en formato Delta.
    La carga ejecutada en el notebook utiliza
    overwrite del resultado transformado.

politica_historial:
  llave_evento: evento_id
  identificador_envio: tracking_id

  conservar_multiples_eventos_por_envio: true
  deduplicar_por_tracking_id_solamente: false

  regla: >
    Un envio puede pasar por pendiente,
    en_transito, entregado o devuelto.

    Los eventos validos se conservan
    individualmente para reconstruir su historia.

  eventos_huerfanos: >
    Enviar a cuarentena los eventos
    cuya venta_id no existe en Silver Ventas.

    No eliminar automaticamente todos los eventos
    de un tracking_id cuando solamente algunos
    tienen referencias invalidas.

  historiales_incompletos: >
    Los envios que pierden eventos por cuarentena
    pueden mantener un historial parcial en Silver.

    No se deben reconstruir fechas ni estados
    inexistentes.

problemas_conocidos:
  - problema: eventos de ventas huerfanas
    eventos_detectados: 476
    tratamiento: cuarentena por VENTA_HUERFANA

  - problema: tracking asociado a multiples ventas
    envios_detectados_bronze: 69
    tratamiento: >
      Conservar los eventos con ventas validas.
      Enviar a cuarentena los eventos huerfanos.

  - problema: tracking con mezcla de ventas validas y huerfanas
    envios_detectados: 63
    tratamiento: >
      Conservar eventos validos y documentar
      la posible perdida de continuidad historica.

  - problema: tracking con solamente eventos huerfanos
    envios_detectados: 148
    tratamiento: >
      Sus eventos no ingresan a Silver
      mientras no exista una venta de origen valida.

  - problema: mensajes reprocesados
    eventos_detectados: 0
    tratamiento: >
      Mantener la deduplicacion preventiva
      por identidad de evento de negocio.

  - problema: estado_entrega con variantes de escritura
    variantes_originales: 13
    tratamiento: normalizar a cuatro estados

  - problema: courier con variantes de escritura
    variantes_originales: 10
    tratamiento: normalizar a tres couriers

  - problema: entregas sin pendiente en Silver
    envios_detectados: 18
    tratamiento: >
      Conservar eventos validos.
      No calcular tiempos de entrega sin fecha inicial.

  - problema: fecha_actualizacion nula
    filas_afectadas_exploratorias: 285
    tratamiento: conservar nulo
    nota: >
      Conteo procedente del contrato inicial.
      No fue recalculado en las validaciones de Silver.

