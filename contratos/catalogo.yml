fuente: catalogo
version: 1
ultima_actualizacion: '2026-11-19'
responsable: area_productos
llegada: JSON en /Volumes/proyecto_final/default/vol_landing/catalogo/
metodo_ingesta: 'COPY INTO: dos snapshots completos poco frecuentes, multiLine=true y primitivesAsString=true'
frecuencia_esperada: snapshots marzo y agosto 2026
tipo_entrega: snapshot completo
tabla_bronze: proyecto_final.bronze.catalogo
tabla_silver: proyecto_final.silver.catalogo
llave: producto_id
historizacion: último snapshot por producto, conservando activo=false; snapshot previo trazable en Bronze
columnas:
- nombre: producto_id
  tipo: string
  nulo: false
- nombre: nombre_producto
  tipo: string
  nulo: false
- nombre: categoria
  tipo: string
  nulo: false
  valores_permitidos:
  - linea_blanca
  - cocina
  - electronica
  - climatizacion
  - entretenimiento
- nombre: marca
  tipo: string
  nulo: true
- nombre: precio_lista
  tipo: decimal(12,2)
  nulo: false
  regla: numérico mayor a 0
- nombre: activo
  tipo: boolean
  nulo: false
reglas_de_calidad:
- nombre: precio_valido
  condicion: precio_lista IS NOT NULL AND precio_lista > 0
  politica: drop
  destino_rechazos: proyecto_final.silver.cuarentena
  justificacion: El precio inválido impide análisis confiable del catálogo.
- nombre: producto_identificado
  condicion: producto_id IS NOT NULL AND categoria IS NOT NULL
  politica: drop
  destino_rechazos: proyecto_final.silver.cuarentena
  justificacion: La llave y categoría son indispensables para joins y reseñas.
transformaciones_silver:
- Convertir precio_lista de número o texto S/ 1,299.90 a decimal.
- Normalizar 17 variantes a linea_blanca, cocina, electronica, climatizacion y entretenimiento.
- Deduplicar producto_id dentro de cada snapshot de manera determinista, documentando la selección del precio.
- Conservar productos inactivos con activo=false; seleccionar el último snapshot para la dimensión vigente.
- Mantener fecha_snapshot derivada del nombre de archivo para orden de versiones.
problemas_conocidos:
- problema: precio_lista nulo
  ejemplo: precio_lista=null
  filas_afectadas: 36
  tratamiento: cuarentena
- problema: precio_lista no positivo
  ejemplo: precio_lista<=0
  filas_afectadas: 58
  tratamiento: cuarentena
- problema: marca nula
  ejemplo: marca=null
  filas_afectadas: 94
  tratamiento: permitir nulo
- problema: producto repetido en snapshot de marzo
  ejemplo: 25 productos duplicados
  filas_afectadas: 25
  tratamiento: deduplicación determinista
- problema: categorías variantes
  ejemplo: Climatización / CLIMATIZACION
  filas_afectadas: 4705
  tratamiento: normalizar las 17 variantes; cifra = registros totales, no inválidos
notas_implementacion:
- Los conteos de problemas son exploratorios y las categorías pueden solaparse.
- 'Reglas propuestas: deben implementarse idénticas en el código y verificarse tras cada lote.'
