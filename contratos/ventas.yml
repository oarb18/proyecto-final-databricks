
fuente: ventas
version: 2
ultima_actualizacion: '2026-11-21'
responsable: area_comercial

llegada: CSV en /Volumes/proyecto_final/default/vol_landing/ventas/
metodo_ingesta: 'Auto Loader: tres lotes incrementales y reingestas'
frecuencia_esperada: tres lotes marzo-octubre 2026

tabla_bronze: proyecto_final.bronze.ventas
tabla_silver: proyecto_final.silver.ventas
tabla_cuarentena: proyecto_final.silver.cuarentena

llave: venta_id

columnas:
  - nombre: venta_id
    tipo: string
    nulo: false
    regla: identificador unico de venta

  - nombre: sucursal_id
    tipo: string
    nulo: false
    regla: sucursal existente en Silver Sucursales

  - nombre: producto_id
    tipo: string
    nulo: false
    regla: producto existente en Bronze o Silver Catalogo

  - nombre: vendedor_id
    tipo: string
    nulo: true
    regla: >
      Se permite NULL en ecommerce porque la compra
      puede realizarse sin intervencion de un vendedor.
      No se generan vendedores ficticios.

  - nombre: cantidad
    tipo: int
    nulo: false
    regla: mayor a 0

  - nombre: monto_total
    tipo: decimal(12,2)
    nulo: false
    regla: mayor a 0

  - nombre: metodo_pago
    tipo: string
    nulo: false
    valores_permitidos:
      - tarjeta
      - efectivo
      - transferencia
      - yape
      - plin

  - nombre: fecha_venta
    tipo: timestamp
    nulo: false

  - nombre: canal
    tipo: string
    nulo: false
    valores_permitidos:
      - tienda_fisica
      - ecommerce

reglas_de_calidad:
  - nombre: monto_positivo
    condicion: >
      monto_decimal IS NOT NULL
      AND monto_decimal > 0
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: MONTO_INVALIDO
    justificacion: >
      Los montos vacios, no convertibles, cero o negativos
      distorsionan los ingresos y las ventas netas.
      No se recuperan ni se inventan importes.

  - nombre: cantidad_positiva
    condicion: >
      cantidad_int IS NOT NULL
      AND cantidad_int > 0
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: CANTIDAD_INVALIDA
    justificacion: >
      Las cantidades nulas, no convertibles o no positivas
      afectan los indicadores de unidades vendidas
      y el ranking de productos.

  - nombre: sucursal_valida
    condicion: >
      sucursal_id IS NOT NULL
      AND TRIM(sucursal_id) <> ''
      AND sucursal_id existe en Silver Sucursales
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: SUCURSAL_INVALIDA
    justificacion: >
      Una venta sin sucursal identificable no puede
      atribuirse correctamente a una sucursal.
      En ecommerce se utiliza la sucursal de despacho.

  - nombre: producto_existente
    condicion: >
      producto_id IS NOT NULL
      AND TRIM(producto_id) <> ''
      AND producto_id existe en Bronze o Silver Catalogo
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: PRODUCTO_HUERFANO
    justificacion: >
      Los productos inexistentes en todos los snapshots
      del catalogo no pueden identificarse confiablemente.

      Se aceptan productos presentes solo en Bronze Catalogo,
      aunque se hayan excluido de Silver por precios invalidos.

      No se recuperan precios historicos.

  - nombre: fecha_venta_valida
    condicion: fecha_venta_ts IS NOT NULL
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: FECHA_INVALIDA
    justificacion: >
      Sin una fecha valida no es posible calcular
      los indicadores comerciales por mes.

  - nombre: venta_identificada
    condicion: >
      venta_id IS NOT NULL
      AND TRIM(venta_id) <> ''
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: VENTA_ID_INVALIDO
    justificacion: >
      El identificador de venta permite deduplicar
      y relacionar las transacciones con devoluciones.

  - nombre: metodo_pago_valido
    condicion: metodo_pago_normalizado IS NOT NULL
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: PAGO_INVALIDO
    justificacion: >
      Los metodos de pago deben pertenecer
      a los cinco valores permitidos.

  - nombre: canal_valido
    condicion: >
      canal IN ('tienda_fisica', 'ecommerce')
    politica: drop
    destino_rechazos: proyecto_final.silver.cuarentena
    motivo_rechazo: CANAL_INVALIDO
    justificacion: >
      El canal permite diferenciar las ventas presenciales
      de las realizadas por internet.

  - nombre: venta_unica
    condicion: una sola fila por venta_id
    politica: deduplicar
    justificacion: >
      Las reingestas identicas no deben duplicar
      importes, cantidades ni indicadores de Gold.

transformaciones_silver:
  - >
    Normalizar montos con formatos 1.234,50 y 1234.50
    antes de convertirlos a DECIMAL(12,2).

  - >
    Convertir cantidad a INT mediante try_cast.

  - >
    Convertir fecha_venta a TIMESTAMP utilizando
    formatos tolerantes con try_to_timestamp.

  - >
    Normalizar 17 variantes de metodo_pago
    a tarjeta, efectivo, transferencia, yape y plin.

  - >
    Deduplicar por venta_id usando fecha_ingesta
    descendente y archivo_origen como desempate.

  - >
    Mantener vendedor_id nulo para ecommerce.
    No asignar empleados ficticios.

  - >
    Validar sucursal_id contra Silver Sucursales.

  - >
    Validar producto_id contra Bronze y Silver Catalogo.
    Conservar productos existentes en cualquier snapshot.

  - >
    No completar montos utilizando precios del catalogo.

  - >
    Mantener las nueve columnas definidas en el contrato.

  - >
    Enviar registros invalidos a cuarentena
    conservando todos los motivos de rechazo
    y los datos originales de Bronze.

politica_vendedor:
  ecommerce:
    vendedor_nulo_permitido: true
    justificacion: >
      Las ventas por internet pueden efectuarse directamente
      por el cliente sin intervencion de un vendedor.

  tienda_fisica:
    vendedor_identificado: true
    resultado_bronze_vendedores_nulos: 0

  uso_en_gold: >
    Para ventas netas se incluyen ambos canales.

    Para ventas por vendedor se utilizan solamente
    las transacciones de tienda_fisica.

    La sucursal historica del vendedor se obtiene
    de Silver Empleados SCD Type 2.

    Cuando el vendedor no tiene una version historica
    vigente, la sucursal del reporte sera SIN_ASIGNAR.

referencias_catalogo:
  tabla_bronze: proyecto_final.bronze.catalogo
  tabla_silver: proyecto_final.silver.catalogo

  politica: >
    Un producto es valido si existe en Bronze Catalogo
    o Silver Catalogo.

    No se rechaza una venta historica solo porque
    el producto haya sido excluido de Silver Catalogo
    debido a un precio invalido.

    El importe de la venta se conserva desde Ventas.
    No se heredan ni reconstruyen precios historicos.

problemas_conocidos:
  - problema: monto_total vacio
    ejemplo: monto_total=""
    filas_detectadas_bronze: 152
    tratamiento: cuarentena por MONTO_INVALIDO

  - problema: monto_total no positivo
    ejemplo: monto_total <= 0
    filas_detectadas_bronze: 201
    tratamiento: cuarentena por MONTO_INVALIDO

  - problema: monto invalido tras deduplicacion
    ventas_unicas_afectadas: 347
    tratamiento: cuarentena

  - problema: venta_id repetido entre lotes
    identificadores_repetidos: 235
    filas_duplicadas_adicionales: 240
    identificadores_con_contenido_diferente: 0
    tratamiento: deduplicar

  - problema: producto sin catalogo
    filas_detectadas_bronze: 70
    ventas_unicas_afectadas: 70
    tratamiento: cuarentena por PRODUCTO_HUERFANO

  - problema: sucursal_id vacio
    filas_detectadas_bronze: 105
    tratamiento: cuarentena por SUCURSAL_INVALIDA

  - problema: cantidad invalida
    filas_detectadas_bronze: 68
    ventas_unicas_afectadas: 66
    tratamiento: cuarentena por CANTIDAD_INVALIDA

  - problema: vendedor_id nulo
    filas_detectadas_bronze: 5393
    canal_afectado: ecommerce
    tratamiento: permitido sin rechazo

