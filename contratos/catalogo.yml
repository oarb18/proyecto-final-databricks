fuente: catalogo
version: 3
ultima_actualizacion: '2026-11-20'
responsable: area_productos

llegada: JSON en /Volumes/proyecto_final/default/vol_landing/catalogo/
metodo_ingesta: 'COPY INTO: dos snapshots completos poco frecuentes, multiLine=true y primitivesAsString=true'
frecuencia_esperada: snapshots marzo y agosto 2026
tipo_entrega: snapshot completo

tabla_bronze: proyecto_final.bronze.catalogo
tabla_silver: proyecto_final.silver.catalogo
tabla_cuarentena: proyecto_final.silver.cuarentena

llave: producto_id

historizacion: último snapshot completo disponible como dimensión vigente; conservar activo=false y mantener snapshots anteriores en Bronze

columnas:
  - nombre: producto_id
    tipo: string
    nulo: false

  - nombre: nombre_producto
    tipo: string
    nulo: false

  - nombre: categoria
    tipo: string
    nulo: false
    valores_permitidos:
      - linea_blanca
      - cocina
      - electronica
      - climatizacion
      - entretenimiento

  - nombre: marca
    tipo: string
    nulo: true

  - nombre: precio_lista
    tipo: decimal(12,2)
    nulo: false
    regla: numérico mayor a 0

  - nombre: activo
    tipo: boolean
    nulo: false

  - nombre: fecha_snapshot
    tipo: date
    nulo: false

reglas_de_calidad:
  - nombre: producto_identificado
    condicion: producto_id IS NOT NULL AND TRIM(producto_id) <> ''
    politica: cuarentena
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: El identificador es obligatorio para relacionar productos con ventas y reseñas.

  - nombre: nombre_producto_valido
    condicion: nombre_producto IS NOT NULL AND TRIM(nombre_producto) <> ''
    politica: cuarentena
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: El nombre permite identificar comercialmente el producto.

  - nombre: categoria_valida
    condicion: categoria IN ('linea_blanca', 'cocina', 'electronica', 'climatizacion', 'entretenimiento')
    politica: cuarentena
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: Las categorías deben pertenecer a los cinco valores oficiales después de normalizarlas.

  - nombre: precio_valido
    condicion: precio_lista IS NOT NULL AND precio_lista > 0
    politica: cuarentena
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: Los precios nulos, no convertibles o no positivos no son confiables para los indicadores de negocio.

  - nombre: estado_valido
    condicion: activo IS NOT NULL
    politica: cuarentena
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: El estado comercial debe estar informado.

  - nombre: producto_unico
    condicion: Una sola fila por producto_id en el snapshot vigente
    politica: cuarentena
    destino_rechazos: proyecto_final.silver.cuarentena
    justificacion: Los registros duplicados excedentes deben identificarse y separarse de la dimensión vigente.

