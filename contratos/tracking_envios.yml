validacion_secuencia_estados:
  envios_con_eventos_validos: 5184
  envios_con_pendiente: 5164
  envios_con_entregado: 4018
  entregas_con_tiempo_calculable: 4000
  entregas_sin_pendiente: 18
  entregas_antes_pendiente: 0
  envios_con_devolucion: 277

  analisis_historial_incompleto:
    envios_mixtos: 63
    entregas_sin_pendiente_en_envios_mixtos: 18
    entregas_sin_pendiente_no_mixtos: 0

  politica_gold: >
    Calcular la duracion solamente cuando existan
    primer_pendiente y primer_entregado
    y la fecha de entrega sea posterior
    o igual a la fecha pendiente.

    Los 18 envios sin pendiente se conservan
    en Silver, pero no aportan al promedio
    de tiempo de entrega.

cuarentena:
  tabla: proyecto_final.silver.cuarentena
  fuente: tracking_envios
  total_registros: 476
  eventos_distintos: 476

  motivos:
    VENTA_HUERFANA: 476

  formato:
    fuente: string
    clave_registro: string
    motivo_rechazo: string
    fecha_rechazo: timestamp
    datos_originales: string
    archivo_origen: string

  clave_registro: >
    evento_id convertido a string.

  archivo_origen: >
    Azure SQL Database - dbo.TrackingEnvios

  politica: >
    Conservar una fila por evento rechazado,
    incluyendo motivo_rechazo, fecha_rechazo
    y datos originales en formato JSON.

    No modificar los rechazos correspondientes
    a las demas fuentes.

conciliacion:
  total_bronze: 15139
  eventos_reprocesados_eliminados: 0
  total_cuarentena: 476
  total_silver: 14663
  formula: 15139 = 0 + 476 + 14663
  estado: validado

uso_en_gold:
  - pregunta: 6
    indicador: tiempo_promedio_entrega
    descripcion: >
      Calcular las horas transcurridas desde
      el primer evento pendiente hasta
      el primer evento entregado de cada envio
      que tenga ambas marcas temporales.

      Utilizar fecha_modificacion para
      ordenar los eventos historicos.

      Excluir del calculo de duracion
      los historiales sin pendiente.

  - pregunta: 6
    indicador: porcentaje_envios_devueltos
    descripcion: >
      Identificar el ultimo estado de cada envio
      utilizando fecha_modificacion
      y evento_id como desempate.

      Calcular el porcentaje de devueltos
      entre envios cuyo estado final
      sea entregado o devuelto.

      Utilizar el courier normalizado
      para las agrupaciones por empresa.

  - pregunta: 6
    indicador: integridad_historial
    descripcion: >
      Documentar los envios con eventos
      enviados a cuarentena y aquellos
      que tienen historial incompleto.

      No inventar eventos pendientes
      ni modificar los estados originales.

estado_integracion_origen:
  origen_declarado: Azure SQL Database
  tabla_origen: dbo.TrackingEnvios

  connection_unity_catalog: PENDIENTE
  conector_lakeflow_verificado: false
  dos_ejecuciones_incrementales_verificadas: false

  nota: >
    La existencia de datos en Bronze y la correcta
    transformacion Silver no demuestran por si solas
    la configuracion de Lakeflow Connect ni
    las dos ejecuciones incrementales exigidas.

    Se requiere evidencia independiente del conector,
    la Connection real y sus ejecuciones.

notas_implementacion:
  - >
    Los 15139 eventos fueron evaluados
    utilizando las reglas del contrato.

  - >
    Los 476 eventos huerfanos se conservaron
    en cuarentena, sin eliminarlos sin trazabilidad.

  - >
    No se detectaron eventos reprocesados
    con la identidad de negocio evaluada.

  - >
    El historial de cada tracking_id se mantiene
    mediante sus diferentes eventos.

  - >
    No se inventan fechas ni cambios de estado.

  - >
    Los 18 envios entregados sin pendiente
    no se incluyen en el promedio de duracion.

  - >
    Los nombres de courier se normalizaron
    para evitar separar una misma empresa
    en distintas categorias.

  - >
    Silver Ventas debe estar disponible
    antes de procesar Tracking.

  - >
    La tabla compartida de cuarentena
    conserva los registros de otras fuentes.

  - >
    El README general se actualizara
    despues de cerrar todas las fuentes Silver.

  - >
    La configuracion y evidencias definitivas
    de Lakeflow Connect siguen pendientes.
